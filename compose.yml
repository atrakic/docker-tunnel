services:
  app:
    build: .
    container_name: app
    command: app
    environment:
      - PORTS="80:3000,443:3001"
      - PROXY_SSH_PORT=22
      #- PROXY_HOST=0.0.0.0
      - PROXY_SSH_USER="${USER}"
    volumes:
      - "${HOME}/.ssh/id_rsa:/ssh.key"
    depends_on:
      - proxy
  proxy:
    build: .
    container_name: proxy
    command: proxy
    environment:
      - PORTS="80:3000,443:3001"
